[project]
name = "piano-duet"
version = "0.1.0"
description = "Learn piano on your real piano, with an AI partner that runs entirely on your Mac"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Eric Fithian" }]
keywords = ["piano", "music", "sight-reading", "music-education", "transcription", "mlx"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Education",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
requires-python = ">=3.11,<3.13"
dependencies = [
    "aria",
    "defusedxml>=0.7.1",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "huggingface-hub>=2.1.1",
    "imageio-ffmpeg>=0.6.0",
    "numpy>=2.4.6",
    "onnx>=1.20",
    "onnxruntime>=1.30.0",
    "piano-transcription-inference>=0.0.6",
    "scipy>=1.17.1",
    "soundfile>=0.14.0",
    "tqdm>=4.70.1",
    "transkun==2.0.1",
    "uvicorn[standard]>=0.54.0",
    "yt-dlp>=2026.8.19",
]

[project.scripts]
piano-duet = "piano_duet.cli:main"

[project.urls]
Homepage = "https://piano-duet.vercel.app"
Documentation = "https://piano-duet.vercel.app/start/install/"
Repository = "https://github.com/Eric-Fithian/piano-duet"
Issues = "https://github.com/Eric-Fithian/piano-duet/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/piano_duet"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.uv.sources]
aria = { git = "https://github.com/EleutherAI/aria", rev = "c2f67bc90b49335543c0249fe00fb84a9337faf8" }

[dependency-groups]
dev = [
    "onnx-ir>=1.1.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
