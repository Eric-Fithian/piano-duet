[project]
name = "piano-duet"
version = "0.1.0"
description = "A local microphone piano duet for Apple Silicon"
requires-python = ">=3.11,<3.13"
dependencies = [
    "aria",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "huggingface-hub>=2.1.1",
    "numpy>=2.4.6",
    "onnxruntime>=1.30.0",
    "piano-transcription-inference>=0.0.6",
    "scipy>=1.17.1",
    "soundfile>=0.14.0",
    "tqdm>=4.70.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
piano-duet = "piano_duet.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/piano_duet"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.uv.sources]
aria = { git = "https://github.com/EleutherAI/aria", rev = "c2f67bc90b49335543c0249fe00fb84a9337faf8" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
