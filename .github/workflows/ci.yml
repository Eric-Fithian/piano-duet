name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.10.12"
          enable-cache: true
      - run: uv run --frozen --only-dev ruff check src tests
      - run: shellcheck site/public/install.sh

  python:
    name: Python tests
    # The app runs Aria on MLX, which needs Apple Silicon.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.10.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --frozen pytest -q

  javascript:
    name: JavaScript tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test tests/*.test.mjs

  core:
    name: TypeScript core and Python parity
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.10.12"
          enable-cache: true
      - run: npm ci
      - run: uv sync --frozen
      - run: npm run check:core
      - run: npm run test:core

  model-parity:
    name: Published model parity
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.10.12"
          enable-cache: true
      - run: uv sync --frozen
      - uses: actions/cache@v4
        with:
          path: .cache/ci-models
          key: published-models-${{ hashFiles('site/app/src/model-catalog.ts', 'tests/inference/download-models.mjs') }}
      - run: node tests/inference/download-models.mjs aria live-transcription recording-transcription live-reference
      - run: uv run --frozen python tests/inference/published_model_parity.py

  browser-storage:
    name: Browser storage
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.10.12"
          enable-cache: true
      - run: npm ci
      - run: npm ci --prefix site
      - run: npx playwright install chromium webkit
      - run: npm run test:web
        timeout-minutes: 4
      - run: uv run --frozen python tests/inference/audio_fixtures.py
      - run: node tests/inference/audio-decoding.mjs
        timeout-minutes: 3
      - run: node tests/inference/media-recording.mjs
        timeout-minutes: 3
      - uses: actions/cache@v4
        with:
          path: |
            .cache/ci-models/recording-transcription
            .cache/ci-models/midi-to-score
          key: browser-recording-model-${{ hashFiles('site/app/src/model-catalog.ts', 'tests/inference/download-models.mjs') }}
      - run: node tests/inference/download-models.mjs recording-transcription midi-to-score
      - run: node tests/inference/expand-score-fixture.mjs
      - run: node tests/inference/verify-score-browser.mjs webgpu
        timeout-minutes: 3
        env:
          PIANO_SCORE_MODEL_DIR: .cache/ci-models/midi-to-score
          PIANO_SCORE_FIXTURE: .cache/m2st/synthetic-parity.json
          PIANO_SCORE_RUNTIME: "1"
      - run: mkdir -p .cache/browser-inference
      - run: curl --fail --silent --show-error --location https://raw.githubusercontent.com/nbrosowsky/tonejs-instruments/622c2f1c32c8cfce4158ddc3eb26e518ddef37e5/samples/piano/C4.mp3 --output .cache/browser-inference/C4.mp3
      - run: node tests/inference/drill-microphone.mjs
        timeout-minutes: 3
        env:
          PIANO_RECORDING_MODEL_DIR: .cache/ci-models/recording-transcription
          PIANO_BROWSER_CHANNEL: chrome

  site:
    name: Website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
